# Project-wide Gradle settings.
# Settings configured through the IDE (e.g. Android Studio) will override these.
# https://docs.gradle.org/current/userguide/build_environment.html

# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Build performance: parallel execution, build cache and configuration cache.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

# AndroidX package structure.
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete".
kotlin.code.style=official

# R class optimizations: namespaced (non-transitive) and non-final resource IDs,
# which keep the R classes small and make them cacheable across modules.
android.nonTransitiveRClass=true
android.nonFinalResIds=true
