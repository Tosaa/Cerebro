name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Least privilege: the build only needs to read the repository.
permissions:
  contents: read

# Cancel superseded runs for the same branch/PR instead of burning runners on them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Runs before the build so a style regression fails in seconds instead of
      # after a full assemble. `build` depends on `check` and would run detekt
      # again, but the up-to-date check makes the second run free.
      - name: Static analysis with detekt
        run: ./gradlew detekt

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          # Covers detekt's HTML and SARIF output (app/build/reports/detekt/)
          # alongside the unit test and lint reports.
          path: app/build/reports/
          retention-days: 7
